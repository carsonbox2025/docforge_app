name: docforge_app
description: "稿搭子 - AI驱动的智能文档创作平台"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # UI
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4+2
  flutter_svg: ^2.0.17

  # File picking
  file_picker: ^8.1.7

  # Path
  path_provider: ^2.1.5

  # Connectivity
  connectivity_plus: ^6.1.4

  # URL launcher
  url_launcher: ^6.3.1

  # Share
  share_plus: ^10.0.0

  # Open file with system app
  open_filex: ^4.6.0

  # WebView (HTML preview)
  webview_flutter: ^4.10.0

  # HTML widget (cross-platform HTML rendering, fallback for non-mobile)
  flutter_widget_from_html: ^0.15.3

  # Analytics & crash reporting
  sentry_flutter: ^8.14.0
  umeng_common_sdk: 1.3.0

  # Utilities
  equatable: ^2.0.7
  intl: ^0.20.2
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^2.5.7
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1E40AF"
  adaptive_icon_foreground: assets/icons/app_icon.png
