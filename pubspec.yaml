name: docforge_app
description: "稿搭子 - AI驱动的智能文档创作平台"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Network
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # UI
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4+2

  # File picking
  file_picker: ^8.1.7

  # Path
  path_provider: ^2.1.5

  # Connectivity
  connectivity_plus: ^6.1.4

  # URL launcher
  url_launcher: ^6.3.1

  # Share
  share_plus: ^10.0.0

  # WebView (HTML preview)
  webview_flutter: ^4.10.0

  # Utilities
  equatable: ^2.0.7
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^2.5.7
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
